[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "billboard-intel"
version = "0.1.0"
description = "Billboard Data Intelligence: evolución del sonido de los #1 del Hot 100"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2", "numpy>=1.26", "scipy>=1.11", "networkx>=3.2", "pyvis>=0.3.2",
    "matplotlib>=3.8", "openpyxl>=3.1",
    "fastapi>=0.110", "uvicorn[standard]>=0.30", "requests>=2.31",
    "streamlit>=1.40", "plotly>=5.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "statsmodels>=0.14", "ruff>=0.5", "jupyterlab>=4.2", "nbclient>=0.10", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]  # textos largos en la UI y en los comentarios
